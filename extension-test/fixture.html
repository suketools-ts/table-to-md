<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Backlog 風の検証用ページ</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; max-width: 900px; }
      textarea { width: 100%; height: 220px; font-family: ui-monospace, monospace; font-size: 13px; }
      table { border-collapse: collapse; margin-top: 16px; }
      th, td { border: 1px solid #ccc; padding: 6px 12px; }
      th { background: #eef; }
    </style>
  </head>
  <body>
    <h1>課題の編集（検証用）</h1>

    <h2>入力欄（textarea）</h2>
    <textarea id="src">説明文です。

| 商品名 | 単価 | 在庫 |h
| りんご | 120 | 30 |
| みかん | 80 | 120 |

以上です。</textarea>

    <h2>入力欄（contenteditable）</h2>
    <div id="rich" contenteditable="true" style="border:1px solid #ccc;padding:8px;min-height:80px;white-space:pre-wrap;">| a | b |
| --- | --- |
| 1 | 2 |</div>

    <h2>Backlog コメント（課題の説明欄）</h2>
    <div class="ticket__description loom" id="issueDescription" data-testid="issueDescription"><h2> 1. 要求事項</h2>
<table>
<tbody><tr><th>No</th><th>種別</th><th>要求事項</th></tr>
<tr><td>1</td><td>画面</td><td>一覧画面から各種設定をまとめて登録・変更できるようにしたい</td></tr>
<tr><td>2</td><td>機能</td><td></td></tr>
</tbody></table>
<br>
<p id="mockup">●モックアップ環境<br>
・URL：<a href="http://example.invalid/" target="_blank" rel="noopener noreferrer" class="loom-link-another">http://example.invalid/</a><br>
・ID：sample-user<br>
・PASS：xxxxxxxx</p></div>

    <h2>表示されたテーブル</h2>
    <div id="rendered">
      <table>
        <thead>
          <tr><th>担当</th><th>状態</th><th>期限</th></tr>
        </thead>
        <tbody>
          <tr><td>田中</td><td>処理中</td><td>2026-10-01</td></tr>
          <tr><td rowspan="2">鈴木</td><td>未対応</td><td>2026-10-05</td></tr>
          <tr><td>完了</td><td>2026-09-30</td></tr>
        </tbody>
      </table>
    </div>

    <script>
      // 拡張機能の chrome API を最小限だけ模倣する。
      // content.js は onMessage のリスナを登録するので、それを控えて手で叩けるようにする。
      let listener = null;
      window.chrome = {
        runtime: { onMessage: { addListener: (fn) => { listener = fn; } } },
      };
      window.__send = (message) => listener(message, {}, () => {});
      // クリップボードの書き込み先を控える（ヘッドレスでは権限が下りないことがあるため）。
      window.__clipboard = null;
      document.addEventListener('copy', (e) => {
        window.__clipboard = e.clipboardData ? e.clipboardData.getData('text/plain') : null;
      });
    </script>
    <script src="../dist-extension/content.js"></script>
  </body>
</html>
